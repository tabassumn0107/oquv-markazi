<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Sky Blue Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container (transparent or soft backdrop) -->
  <g transform="translate(40, 20)">
    <!-- Symbol / Icon -->
    <g transform="translate(10, 0)">
      <!-- Outer Hexagonal / Diamond Shield -->
      <path d="M 90,10 L 160,50 L 160,135 L 90,180 L 20,135 L 20,50 Z" 
            fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
      
      <path d="M 90,20 L 150,55 L 150,130 L 90,168 L 30,130 L 30,55 Z" 
            fill="none" stroke="url(#skyGrad)" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />

      <!-- Open Book Base -->
      <path d="M 45,128 C 65,115 85,115 90,125 C 95,115 115,115 135,128 C 120,138 95,138 90,132 C 85,138 60,138 45,128 Z" 
            fill="url(#skyGrad)" />
      
      <!-- Central Rising Flame / Star of Knowledge -->
      <!-- Left Flame Petal -->
      <path d="M 90,118 C 70,100 60,70 78,45 C 80,62 88,75 90,118 Z" 
            fill="url(#goldGrad)" />
      <!-- Right Flame Petal -->
      <path d="M 90,118 C 110,100 120,70 102,45 C 100,62 92,75 90,118 Z" 
            fill="url(#goldGrad)" opacity="0.9" />
      <!-- Center Brilliant Beacon -->
      <path d="M 90,115 C 83,85 86,55 90,28 C 94,55 97,85 90,115 Z" 
            fill="#FFFFFF" />

      <!-- Sparkle Star at Top -->
      <polygon points="90,18 93,26 101,29 93,32 90,40 87,32 79,29 87,26" fill="#FDE047" />

      <!-- Orbital Rings (Global Scope) -->
      <ellipse cx="90" cy="95" rx="55" ry="16" fill="none" stroke="url(#skyGrad)" stroke-width="2" transform="rotate(-20, 90, 95)" opacity="0.8" />
    </g>

    <!-- Typography -->
    <g transform="translate(210, 30)">
      <!-- Brand Name -->
      <text x="0" y="70" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="64" font-weight="800" fill="#0F172A" letter-spacing="6">
        LUMEN
      </text>

      <!-- Grand Academy Subtitle -->
      <text x="5" y="112" font-family="'Inter', 'Montserrat', 'Helvetica', sans-serif" font-size="20" font-weight="700" fill="url(#goldGrad)" letter-spacing="10">
        GRAND ACADEMY
      </text>

      <!-- Tagline -->
      <text x="7" y="142" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#0284C7" letter-spacing="3">
        WHERE BRILLIANCE BEGINS • KELAJAK NURI
      </text>

      <!-- Decorative Divider -->
      <line x1="6" y1="123" x2="380" y2="123" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5" />
    </g>
  </g>
</svg>
